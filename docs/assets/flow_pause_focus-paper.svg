<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1474" height="885" viewBox="0 0 1474 885"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#52728a" /></marker></defs><rect x="0.00" y="0.00" width="1473.64" height="884.11" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="82.00" y="63.00" fill="#25323b" font-size="31" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">3.11 暂停、继续与窗口失焦</text><text x="1391.64" y="61.00" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="end">业务流程 · 目标接口</text><line x1="82.00" y1="88.00" x2="1391.64" y2="88.00" stroke="#b7c6cf" stroke-width="1.5" /><path d="M294.44,235.86 L294.44,253.39 L294.44,275.61 L294.44,294.88" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M294.44,373.44 L294.44,390.58 L294.44,412.32 L294.44,432.14" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M294.44,531.92 L294.44,550.29 L294.44,571.88 L294.44,590.51" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M294.44,669.18 L294.44,686.72 L294.44,708.94 L294.44,728.21" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M736.81,235.86 L736.81,253.39 L736.81,275.61 L736.81,294.88" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M736.81,373.44 L736.81,393.62 L736.81,420.20 L736.81,442.50" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M1179.17,235.86 L1179.17,253.39 L1179.17,275.61 L1179.17,294.88" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M1179.17,373.44 L1179.17,390.58 L1179.17,412.32 L1179.17,432.14" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><path d="M1179.17,531.92 L1179.17,550.29 L1179.17,571.88 L1179.17,590.51" fill="none" stroke="#6f899a" stroke-width="1.7" marker-end="url(#arrow)" /><rect x="233.05" y="170.56" width="122.78" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="294.44" y="197.78" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="294.44" y="219.22" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">按暂停键</text><rect x="165.35" y="307.79" width="258.19" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="294.44" y="335.00" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="294.44" y="356.44" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">submitCommand(暂停)</text><rect x="85.00" y="445.01" width="418.89" height="86.67" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="294.44" y="472.34" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="294.44" y="493.78" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">handleMenuCommand() 将会话改为已暂</text><text x="294.44" y="515.22" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">停</text><rect x="139.16" y="603.89" width="310.56" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="294.44" y="631.11" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="294.44" y="652.55" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">advanceElapsed() 不推进世界</text><rect x="106.66" y="741.11" width="375.56" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="294.44" y="768.33" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="294.44" y="789.77" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">readRenderSnapshot() 显示暂停菜单</text><rect x="675.42" y="170.56" width="122.78" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="736.81" y="197.78" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="736.81" y="219.22" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">窗口失焦</text><rect x="546.32" y="307.79" width="380.98" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="736.81" y="335.00" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="736.81" y="356.44" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">submitCommand(所有按住动作释放)</text><rect x="549.93" y="455.84" width="373.75" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="736.81" y="483.06" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="736.81" y="504.50" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">normalizeCommand() 清空按住状态</text><rect x="1117.78" y="170.56" width="122.78" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="1179.17" y="197.78" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="1179.17" y="219.22" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">点击继续</text><rect x="1050.07" y="307.79" width="258.19" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="1179.17" y="335.00" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="1179.17" y="356.44" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">submitCommand(继续)</text><rect x="969.73" y="445.01" width="418.89" height="86.67" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="1179.17" y="472.34" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="1179.17" y="493.78" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">handleMenuCommand() 恢复游玩并重置</text><text x="1179.17" y="515.22" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">计时基准</text><rect x="973.34" y="603.89" width="411.67" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="1179.17" y="631.11" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="1179.17" y="652.55" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">下一次定时唤醒再调用 advanceElapsed()</text><text x="82.00" y="856.11" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">箭头表示处理顺序；底层模块的结果先返回业务层，再由协调器传给下一步。</text></svg>