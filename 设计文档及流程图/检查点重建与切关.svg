<text x="249" y="326" text-anchor="start" font-size="16" font-weight="400" fill="#7953a0">重建本关</text>
<text x="126" y="430" text-anchor="middle" font-size="16" font-weight="400" fill="#7953a0">切换下一关</text>
<text x="501" y="488" text-anchor="middle" font-size="16" font-weight="400" fill="#314d6a">01 准备 World</text>
<text x="501" y="606" text-anchor="middle" font-size="16" font-weight="400" fill="#314d6a">02 仅切关</text>
