ight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightState.h</text><text x="742.50" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">destroyWorld()</text><rect x="902.50" y="210.00" width="250.00" height="174.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.6" /><text x="920.50" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">04</text><text x="1036.50" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">关闭存档连接</text><line x1="920.50" y1="258.00" x2="1134.50" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="1027.50" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">KnightSave.dll</text><text x="1027.50" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightSave.h</text><text x="1027.50" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">closeSaveStore()</text><line x1="82.00" y1="460.00" x2="1118.00" y2="460.00" stroke="#d7e0e5" stroke-width="1" /><text x="82.00" y="486.00" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">返回菜单仅销毁本关世界与地图，存档连接在退出程序时关闭。</text><text x="82.00" y="536.00" fill="#566873" font-size="14" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">共享数据类型：KnightContracts.h；带“内部逻辑”的节点不代表新增函数接口。</text></svg>