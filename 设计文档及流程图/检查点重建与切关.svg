<text x="56" y="598" text-anchor="start" font-size="16" font-weight="700" fill="#172d43">prepareLevel 参数</text>
<text x="56" y="621" text-anchor="start" font-size="15" font-weight="400" fill="#475d71">复活  levelId · restoreCheckpoint=true</text>
<text x="56" y="644" text-anchor="start" font-size="15" font-weight="400" fill="#475d71">切关  目标 levelId · restoreCheckpoint=false</text>
<text x="56" y="716" text-anchor="start" font-size="16" font-weight="700" fill="#172d43">失败时返回 false</text>
<text x="56" y="739" text-anchor="start" font-size="15" font-weight="400" fill="#475d71">填写 errorMessage，保留原 World 与槽文件</text>
</g>
