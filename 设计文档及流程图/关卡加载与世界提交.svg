<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="1046" viewBox="0 32 1464 1046" xml:lang="zh-CN" role="img" aria-labelledby="title description">
<title id="title">关卡加载与世界提交</title>
<desc id="description">两个入口读取槽位、解析玩家进度并准备世界。选关须原子写入起点后提交，继续从槽位关卡恢复。未选关的槽转入选关页。</desc>
