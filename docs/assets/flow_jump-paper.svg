 font-family="Microsoft YaHei" text-anchor="middle">撞顶、落地和允许位置</text><rect x="532.77" y="1578.98" width="136.00" height="26.00" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="600.77" y="1596.98" fill="#566873" font-size="14" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">速度和跳跃次数候选</text><rect x="527.39" y="1873.29" width="98.00" height="26.00" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="576.39" y="1891.29" fill="#566873" font-size="14" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">新快照与事件</text><rect x="292.02" y="170.57" width="162.50" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="373.27" y="197.79" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="373.27" y="219.23" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">跳跃键新按下</text><rect x="223.40" y="309.67" width="299.73" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="373.27" y="336.89" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="373.27" y="358.33" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">submitCommand(跳跃按下)</text><rect x="210.77" y="448.64" width="325.00" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="373.27" y="475.86" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="373.27" y="497.30" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">检查游玩状态、生命、跳跃次数</text><rect x="176.46" y="603.99" width="223.89" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="288.40" y="631.21" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="288.40" y="652.65" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">本帧不产生跳跃变更</text><rect x="445.48" y="603.99" width="162.50" height="65.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.5" /><text x="526.73" y="631.21" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">对象与状态：</text><text x="526.73" y="652.65" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">readWorld()</text><rect x="445.48" y="759.21" width="162.50" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="526.73" y="786.43" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="526.73" y="807.87" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">形成跳跃意图</text><rect x="329.93" y="898.23" width="393.61" height="65.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.5" /><text x="526.73" y="925.45" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">运动与物理：</text><text x="526.73" y="946.89" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">proposeMotion(快照, 关卡, 意图, 步长)</text><rect x="445.48" y="1053.52" width="162.50" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="526.73" y="1080.74" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="526.73" y="1102.18" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">接收运动提案</text><rect x="343.47" y="1192.54" width="366.52" height="65.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.5" /><text x="526.73" y="1219.76" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">地图与碰撞：</text><text x="526.73" y="1241.20" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">resolveMovement(地图, 快照, 提案)</text><rect x="445.48" y="1347.82" width="162.50" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="526.73" y="1375.04" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="526.73" y="1396.48" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">接收碰撞裁决</text><rect x="394.02" y="1486.85" width="265.42" height="65.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.5" /><text x="526.73" y="1514.07" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">运动与物理：</text><text x="526.73" y="1535.51" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">finishMotion(提案, 裁决)</text><rect x="445.48" y="1642.13" width="162.50" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="526.73" y="1669.35" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="526.73" y="1690.79" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">合并本帧变更</text><rect x="392.22" y="1781.15" width="269.02" height="65.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.5" /><text x="526.73" y="1808.37" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">对象与状态：</text><text x="526.73" y="1829.81" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">applyChanges(整批变更)</text><rect x="435.55" y="1936.44" width="182.36" height="65.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.5" /><text x="526.73" y="1963.66" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">业务层：</text><text x="526.73" y="1985.10" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">制作画面和事件</text><rect x="414.79" y="2075.46" width="223.89" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="526.73" y="2102.68" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="526.73" y="2124.12" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">绘制跳跃并播放反馈</text><text x="82.00" y="2190.46" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">箭头表示处理顺序；底层模块的结果先返回业务层，再由协调器传给下一步。</text></svg>