<text x="488" y="240" text-anchor="middle" font-size="16" font-weight="400" fill="#314d6a">修正后结算</text>
<text x="488" y="297" text-anchor="middle" font-size="16" font-weight="400" fill="#227461">player.health</text>
<text x="984" y="240" text-anchor="middle" font-size="16" font-weight="400" fill="#314d6a">frameNumber</text>
<text x="984" y="297" text-anchor="middle" font-size="16" font-weight="400" fill="#227461">bool</text>
<text x="894" y="371" text-anchor="middle" font-size="16" font-weight="400" fill="#314d6a">damage · 敌人或陷阱条件通过</text>
<text x="1162" y="444" text-anchor="end" font-size="15" font-weight="400" fill="#314d6a">invincibleFrames == 0</text>
<text x="1297" y="444" text-anchor="start" font-size="16" font-weight="400" fill="#227461">实际扣血量</text>
<text x="398" y="489" text-anchor="middle" font-size="16" font-weight="400" fill="#314d6a">health == 0 · Dead</text>
<text x="398" y="607" text-anchor="middle" font-size="16" font-weight="400" fill="#314d6a">health &gt; 0</text>
<text x="1048" y="603" text-anchor="start" font-size="16" font-weight="700" fill="#172d43">陷阱间隔</text>
<text x="1048" y="626" text-anchor="start" font-size="15" font-weight="400" fill="#475d71">接触且 damageIntervalFrames 满足</text>
<text x="1048" y="649" text-anchor="start" font-size="15" font-weight="400" fill="#475d71">实际扣血后记录伤害帧</text>
</g>
