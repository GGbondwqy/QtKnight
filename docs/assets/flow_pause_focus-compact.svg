<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#52728a" /></marker></defs><rect x="0.00" y="0.00" width="1200.00" height="560.00" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="82.00" y="63.00" fill="#25323b" font-size="31" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">3.11 暂停、继续与失焦</text><text x="1118.00" y="61.00" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="end">业务与接口调用</text><line x1="82.00" y1="88.00" x2="1118.00" y2="88.00" stroke="#b7c6cf" stroke-width="1.5" /><text x="82.00" y="135.00" fill="#25323b" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">暂停／继续命令以及失焦后的释放命令，都从界面进入业务层。</text><text x="82.00" y="183.00" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">底层调用统一由 KnightGame.dll 发起；箭头表示处理顺序，不表示底层模块互调。</text><line x1="297.50" y1="297.00" x2="329.50" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="582.50" y1="297.00" x2="614.50" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="867.50" y1="297.00" x2="899.50" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="47.50" y="210.00" width="250.00" height="174.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.6" /><text x="65.50" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">01</text><text x="181.50" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">提交暂停或释放</text><line x1="65.50" y1="258.00" x2="279.50" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="172.50" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">UI → KnightGame.dll</text><text x="172.50" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightGame.h</text><text x="172.50" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">submitCommand()</text><rect x="332.50" y="210.00" width="250.00" height="174.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.6" /><text x="350.50" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">02</text><text x="466.50" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">控制逻辑帧推进</text><line x1="350.50" y1="258.00" x2="564.50" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="457.50" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">UI → KnightGame.dll</text><text x="457.50" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightGame.h</text><text x="457.50" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">advanceElapsed()</text><rect x="617.50" y="210.00" width="250.00" height="174.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.6" /><text x="635.50" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">03</text><text x="751.50" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">更新会话与输入</text><line x1="635.50" y1="258.00" x2="849.50" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="742.50" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">KnightGame.dll · 内部</text><text x="742.50" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">GamePrivate.h</text><text x="742.50" y="343.00" fill="#25323b" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">InputState / SessionState</text><text x="742.50" y="367.00" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">内部逻辑 · 非导出函数</text><rect x="902.50" y="210.00" width="250.00" height="174.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.6" /><text x="920.50" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">04</text><text x="1036.50" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面读取当前画面</text><line x1="920.50" y1="258.00" x2="1134.50" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="1027.50" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">UI → KnightGame.dll</text><text x="1027.50" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightGame.h</text><text x="1027.50" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">readRenderSnapshot()</text><text x="1027.50" y="368.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">takeEvents()</text><line x1="82.00" y1="460.00" x2="1118.00" y2="460.00" stroke="#d7e0e5" stroke-width="1" /><text x="82.00" y="486.00" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">暂停：停止世界计时；继续：清空旧输入并重置计时；失焦：释放按住动作。</text><text x="82.00" y="536.00" fill="#566873" font-size="14" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">共享数据类型：KnightContracts.h；带“内部逻辑”的节点不代表新增函数接口。</text></svg>