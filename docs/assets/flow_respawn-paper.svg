iddle">makeRenderSnapshot()、</text><text x="328.12" y="1439.63" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">publishEvents()</text><rect x="140.34" y="1530.11" width="375.56" height="65.00" rx="5" fill="#f8fafb" stroke="#8ca2af" stroke-width="1.5" /><text x="328.12" y="1557.33" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="328.12" y="1578.77" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">readRenderSnapshot() 显示复活位置</text><text x="82.00" y="1645.11" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">箭头表示处理顺序；底层模块的结果先返回业务层，再由协调器传给下一步。</text></svg>