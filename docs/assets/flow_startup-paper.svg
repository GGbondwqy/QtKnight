b" stroke="#8ca2af" stroke-width="1.5" /><text x="355.66" y="1080.70" fill="#25323b" font-size="16" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">界面：</text><text x="355.66" y="1102.14" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">readRenderSnapshot() 绘制菜单</text><text x="82.00" y="1168.48" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">箭头表示处理顺序；底层模块的结果先返回业务层，再由协调器传给下一步。</text></svg>