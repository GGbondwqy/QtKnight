<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#52728a" /></marker></defs><rect x="0.00" y="0.00" width="1200.00" height="560.00" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="82.00" y="63.00" fill="#25323b" font-size="31" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">3.10c 下一关：切换与旧资源释放</text><text x="1118.00" y="61.00" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="end">业务与接口调用</text><line x1="82.00" y1="88.00" x2="1118.00" y2="88.00" stroke="#b7c6cf" stroke-width="1.5" /><text x="82.00" y="135.00" fill="#25323b" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">承接 3.10b：新关候选世界与地图均已就绪，再替换当前句柄。</text><text x="82.00" y="183.00" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">底层调用统一由 KnightGame.dll 发起；箭头表示处理顺序，不表示底层模块互调。</text><line x1="297.50" y1="297.00" x2="329.50" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="582.50" y1="297.00" x2="614.50" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="867.50" y1="297.00" x2="899.50" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="47.50" y="210.00" width="250.00" height="174.00" rx="5" fill="#edf3f6" stroke="#52728a" stroke-width="1.6" /><text x="65.50" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">01</text><text x="181.50" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">切换当前关卡</text><line x1="65.50" y1="258.00" x2="279.50" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="172.50" y="285.00" fill="#52728a" font-size="17" font-weight="700"