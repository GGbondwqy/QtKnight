<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#52728a" /></marker></defs><rect x="0.00" y="0.00" width="1100.00" height="560.00" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="82.00" y="63.00" fill="#25323b" font-size="31" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">3.7a 敌人：决策与运动提案</text><text x="1018.00" y="61.00" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="end">业务与接口调用</text><line x1="82.00" y1="88.00" x2="1018.00" y2="88.00" stroke="#b7c6cf" stroke-width="1.5" /><text x="82.00" y="135.00" fill="#25323b" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">由 KnightGame.h::advanceElapsed() 驱动，每个固定逻辑帧执行。</text><text x="82.00" y="183.00" fill="#566873" font-size="15" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">底层调用统一由 KnightGame.dll 发起；箭头表示处理顺序，不表示底层模块互调。</text><line x1="340.00" y1="297.00" x2="407.00" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="690.00" y1="297.00" x2="757.00" y2="297.00" stroke="#52728a" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="60.00" y="210.00" width="280.00" height="174.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.6" /><text x="78.00" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">01</text><text x="209.00" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">取得只读旧世界</text><line x1="78.00" y1="258.00" x2="322.00" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="200.00" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">KnightState.dll</text><text x="200.00" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightState.h</text><text x="200.00" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">readWorld()</text><rect x="410.00" y="210.00" width="280.00" height="174.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.6" /><text x="428.00" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">02</text><text x="559.00" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">生成敌人意图</text><line x1="428.00" y1="258.00" x2="672.00" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="550.00" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">KnightAI.dll</text><text x="550.00" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightAI.h</text><text x="550.00" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">decideEnemies()</text><rect x="760.00" y="210.00" width="280.00" height="174.00" rx="5" fill="#ffffff" stroke="#8ca2af" stroke-width="1.6" /><text x="778.00" y="241.00" fill="#52728a" font-size="15" font-weight="700" font-family="Microsoft YaHei" text-anchor="start">03</text><text x="909.00" y="242.00" fill="#25323b" font-size="21" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">提出敌人运动</text><line x1="778.00" y1="258.00" x2="1022.00" y2="258.00" stroke="#d7e0e5" stroke-width="1" /><text x="900.00" y="285.00" fill="#52728a" font-size="17" font-weight="700" font-family="Microsoft YaHei" text-anchor="middle">KnightMotion.dll</text><text x="900.00" y="311.00" fill="#566873" font-size="17" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">KnightMotion.h</text><text x="900.00" y="343.00" fill="#25323b" font-size="18" font-weight="400" font-family="Microsoft YaHei" text-anchor="middle">proposeMotion()</text><line x1="82.00" y1="460.00" x2="1018.00" y2="460.00" stroke="#d7e0e5" stroke-width="1" /><text x="82.00" y="486.00" fill="#566873" font-size="16" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">AI 返回移动／攻击意图和决策候选，不直接修改位置。</text><text x="82.00" y="536.00" fill="#566873" font-size="14" font-weight="400" font-family="Microsoft YaHei" text-anchor="start">共享数据类型：KnightContracts.h；带“内部逻辑”的节点不代表新增函数接口。</text></svg>